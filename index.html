<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0A1220" />
    <title>MedShield — Pandemic Intelligence OS</title>
    <meta name="description" content="Real-time pandemic simulation, citizen health passports, hospital resource tracking, and offline crisis tools." />
    <style>
      body { margin: 0; background: #0a1220; }
      #loading {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; background: #0a1220;
        font-family: system-ui, sans-serif; color: #9ba3b5; gap: 16px;
        transition: opacity 0.3s;
      }
      #loading .logo {
        width: 48px; height: 48px; background: #e8202a;
        border-radius: 10px; display: flex; align-items: center; justify-content: center;
        box-shadow: 0 0 32px rgba(232,32,42,0.4);
        font-weight: 900; font-size: 24px; color: white;
      }
      #loading .title { font-size: 20px; font-weight: 800; color: #eef0f3; letter-spacing: -0.5px; }
      #loading .sub { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; }
      #loading .spinner {
        width: 24px; height: 24px; border: 2px solid rgba(255,255,255,0.1);
        border-top-color: #0d9488; border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="logo">S</div>
      <div>
        <div class="title">SENTINEL</div>
        <div class="sub">Crisis Intelligence</div>
      </div>
      <div class="spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide loading screen once React mounts
      document.addEventListener('DOMContentLoaded', function() {
        const observer = new MutationObserver(function() {
          const root = document.getElementById('root');
          if (root && root.children.length > 0) {
            const loading = document.getElementById('loading');
            if (loading) {
              loading.style.opacity = '0';
              setTimeout(() => loading.remove(), 300);
            }
            observer.disconnect();
          }
        });
        observer.observe(document.getElementById('root'), { childList: true });
      });
    </script>
  </body>
</html>
